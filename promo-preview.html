<!doctype html>
<!-- DEV-ONLY harness: lays the rank-up celebration's art (ui/promoArt.ts)
     out flat at four beats of the run — mid-charge, just past the burst
     (glitch tear), deep in the hold, into the fade — over a stand-in
     backdrop, for screenshots. The layers and their opacities follow
     systems/PromotionSystem.ts; the sparks are left out.
     Not part of the game; never ship or link this page.
     ?from=2&to=3  tiers (0 = Bronze … 7 = Overlord)
     ?bg=room|street  bright passthrough stand-in, or the dark district -->
<html>
  <body style="margin:0; background:#0b0a0f">
    <canvas id="c"></canvas>
    <script type="module">
      import { LABEL_H, LABEL_W, PLATE_H, PLATE_W, paintPromoLabel, paintPromoPlate, paintPromoRays, paintPromoRing } from '/src/ui/promoArt.ts';
      import { onFontsReady } from '/src/ui/kit/fonts.ts';
      import { rankBadge, rankBadgeZoom } from '/src/menu/rankBadges.ts';
      import { tierName } from '/src/menu/progression.ts';

      const q = new URLSearchParams(location.search);
      const FROM = Number(q.get('from') ?? 2);
      const TO = Number(q.get('to') ?? 3);
      const BG = q.get('bg') ?? 'room';
      const BEATS = [0.55, 0.9, 2.4, 4.9];
      const CHARGE = 0.8, HOLD = 3.6, FADE = 1.1;
      const M = 560; // px per metre
      const CELL_W = 620, CELL_H = 700;

      const mk = (w, h, paint) => {
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        paint(c.getContext('2d'));
        return c;
      };
      const glowTex = (rgb) => mk(256, 256, (g) => {
        const r = g.createRadialGradient(128, 128, 0, 128, 128, 128);
        r.addColorStop(0, `rgba(${rgb},1)`);
        r.addColorStop(0.35, `rgba(${rgb},0.35)`);
        r.addColorStop(1, `rgba(${rgb},0)`);
        g.fillStyle = r; g.fillRect(0, 0, 256, 256);
      });

      const easeOutBack = (k) => 1 + 2.70158 * (k - 1) ** 3 + 1.70158 * (k - 1) ** 2;

      /** Every layer's state at time t, mirroring PromotionSystem.run(). */
      function stateAt(t) {
        const s = { scale: 1, plate: 0.94, glow: 0, rays: 0, rot: t * 0.7, flash: 0, ring: 0, ringS: 0.3, badge: 1, label: 1, tier: t < CHARGE ? FROM : TO, split: undefined, shudder: 0 };
        const since = t - CHARGE;
        if (t < CHARGE) {
          const k = t / CHARGE;
          s.scale = easeOutBack(k); s.plate = 0.94 * Math.min(1, k * 2);
          s.glow = 0.45 * k; s.rays = 0.24 * k; s.label = Math.max(0, k * 2 - 1);
        } else if (t < CHARGE + HOLD) {
          const spring = 1 + 0.26 * Math.exp(-since * 6) * Math.cos(since * 15);
          s.scale = Math.max(0.3, spring * (1 + 0.03 * Math.sin(t * 4)));
          s.glow = 0.75 + 0.25 * Math.sin(t * 8); s.rays = 0.85 + 0.15 * Math.sin(t * 6);
          s.flash = Math.max(0, 1 - since / 0.35);
          const rk = Math.min(1, since / 0.7);
          s.ringS = 0.3 + rk * 1.7; s.ring = (1 - rk) * 0.9;
          const tk = Math.min(1, since / 0.4);
          if (tk < 1) { s.split = Math.max(2, Math.round(16 * (1 - tk) ** 2)); s.shudder = 0.006 * (1 - tk); }
        } else {
          const k = Math.min(1, (t - CHARGE - HOLD) / FADE);
          s.badge = 1 - k; s.label = 1 - k; s.plate = (1 - k) * 0.94;
          s.glow = (1 - k) * 0.5; s.rays = (1 - k) * 0.6; s.scale = 1 + k * 0.2;
        }
        return s;
      }

      function backdrop(g, x, y, w, h) {
        g.save();
        if (BG === 'street') {
          const s = g.createLinearGradient(0, y, 0, y + h);
          s.addColorStop(0, '#120a24'); s.addColorStop(1, '#05060c');
          g.fillStyle = s; g.fillRect(x, y, w, h);
          for (let i = 0; i < 9; i++) {
            g.fillStyle = i % 2 ? 'rgba(255,61,166,0.18)' : 'rgba(63,242,255,0.14)';
            g.fillRect(x + ((i * 97) % w), y + 40 + ((i * 53) % (h - 120)), 30 + (i % 3) * 20, 90);
          }
        } else {
          // A lit living room: warm, bright, busy — the problem passthrough poses.
          const s = g.createLinearGradient(0, y, 0, y + h);
          s.addColorStop(0, '#d9cbb4'); s.addColorStop(0.62, '#bfa98a'); s.addColorStop(1, '#7d6a55');
          g.fillStyle = s; g.fillRect(x, y, w, h);
          g.fillStyle = '#f3ecd9'; g.fillRect(x + 40, y + 60, 150, 210); // window
          g.fillStyle = '#5f6f7d'; g.fillRect(x + 300, y + 430, 280, 120); // sofa
          g.fillStyle = '#4d5a66'; g.fillRect(x + 290, y + 400, 300, 40);
          g.fillStyle = '#e8d38f'; g.beginPath(); g.arc(x + 520, y + 130, 38, 0, 7); g.fill(); // lamp
        }
        g.restore();
      }

      function draw() {
        const plate = mk(PLATE_W, PLATE_H, (g) => paintPromoPlate(g));
        const rays = mk(256, 256, (g) => paintPromoRays(g, 256));
        const ring = mk(128, 128, (g) => paintPromoRing(g, 128));
        const glow = glowTex('63,242,255');
        const flash = glowTex('230,253,255');
        const cv = document.getElementById('c');
        cv.width = CELL_W * BEATS.length; cv.height = CELL_H;
        const g = cv.getContext('2d');
        BEATS.forEach((t, i) => {
          const s = stateAt(t);
          const ox = i * CELL_W;
          backdrop(g, ox, 0, CELL_W, CELL_H);
          g.save();
          g.beginPath(); g.rect(ox, 0, CELL_W, CELL_H); g.clip();
          g.translate(ox + CELL_W / 2, CELL_H * 0.45);
          g.scale(s.scale * M, s.scale * M);
          const quad = (img, cx, cy, w, h, alpha, add, rot = 0) => {
            if (alpha <= 0) return;
            g.save();
            g.globalAlpha = Math.min(1, alpha);
            if (add) g.globalCompositeOperation = 'lighter';
            g.translate(cx, -cy); g.rotate(rot);
            g.drawImage(img, -w / 2, -h / 2, w, h);
            g.restore();
          };
          quad(plate, 0, -0.1, 0.78, 0.86, s.plate, false);
          quad(rays, 0, 0, 1.15, 1.15, s.rays, true, -s.rot);
          quad(glow, 0, 0, 0.95, 0.95, s.glow, true);
          const badge = rankBadge(s.tier);
          if (badge) { const z = 0.42 * rankBadgeZoom(s.tier); quad(badge, 0, 0, z, z, s.badge, false); }
          quad(flash, 0, 0, 1.4, 1.4, s.flash, true);
          quad(ring, 0, 0, s.ringS, s.ringS, s.ring, true);
          const label = mk(LABEL_W, LABEL_H, (lg) => paintPromoLabel(lg, tierName(TO), s.split));
          quad(label, s.shudder, -0.33, 0.52, 0.1625, s.label, false);
          g.restore();
          g.fillStyle = 'rgba(255,255,255,0.7)';
          g.font = '600 16px monospace';
          g.fillText(`t=${t.toFixed(2)}s`, ox + 12, CELL_H - 14);
        });
        document.body.dataset.ready = '1';
      }

      // Paint once the type and every badge are in.
      const badgesIn = () => [FROM, TO].every((i) => rankBadge(i));
      onFontsReady(() => {
        const wait = () => (badgesIn() ? draw() : setTimeout(wait, 50));
        wait();
      });
    </script>
  </body>
</html>
