<!doctype html>
<!-- DEV-ONLY harness: THE FORGE's frames and gear (docs/forge.md), worn on
     the real rig under the backstreet's light — the same buildBoxer /
     applyGear / applyLook path the mirror uses. Not part of the game;
     never ship or link this page.
       ?frames=standard,lean,heavy,curved   the lineup (default: all four)
       ?gear=crest,pauldrons                worn on every figure
       ?tone=white|onyx                     the base tone (default white)
       ?paint=1                             the demo look
       ?yaw=DEG                             turn the figures (0 = facing you)
       ?cam=near|wide|head                  framing
       drag to orbit, wheel to zoom -->
<html>
  <body style="margin:0; background:#07080b; overflow:hidden">
    <div id="hud" style="position:fixed; left:12px; top:10px; font:600 14px system-ui; color:#9fb4d8; letter-spacing:.08em"></div>
    <script type="module">
      import {
        ACESFilmicToneMapping,
        CircleGeometry,
        Color,
        DirectionalLight,
        EquirectangularReflectionMapping,
        Group,
        HemisphereLight,
        Mesh,
        MeshStandardMaterial,
        PerspectiveCamera,
        PMREMGenerator,
        Quaternion,
        Scene,
        SRGBColorSpace,
        TextureLoader,
        Vector3,
        WebGLRenderer,
      } from 'three';
      import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
      import { buildBoxer, solveTorso } from '/src/avatar/boxer.ts';
      import { applyGear } from '/src/avatar/gear.ts';
      import { applyLook, demoLook } from '/src/avatar/paint.ts';
      import { FRAMES, framesReady } from '/src/avatar/forge.ts';

      const q = new URLSearchParams(location.search);
      const frames = (q.get('frames') ?? FRAMES.map((f) => f.id).join(',')).split(',').filter(Boolean);
      const gear = (q.get('gear') ?? '').split(',').filter(Boolean);
      const tone = q.get('tone') === 'onyx' ? 'onyx' : 'white';
      const yaw = (Number(q.get('yaw') ?? 0) * Math.PI) / 180;
      const cam = q.get('cam') ?? 'near';

      const scene = new Scene();
      const renderer = new WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.toneMapping = ACESFilmicToneMapping;
      renderer.outputColorSpace = SRGBColorSpace;
      document.body.appendChild(renderer.domElement);
      window.__renderer = renderer;
      window.__scene = scene;

      const pmrem = new PMREMGenerator(renderer);
      new TextureLoader().load('arena/neon/env_backstreet.jpg', (t) => {
        t.mapping = EquirectangularReflectionMapping;
        t.colorSpace = SRGBColorSpace;
        scene.environment = pmrem.fromEquirectangular(t).texture;
        scene.background = t;
        scene.backgroundBlurriness = 0.4;
        scene.backgroundIntensity = 0.35;
      });
      scene.add(new HemisphereLight(0x9fb8ff, 0x251a14, 0.5));
      const key = new DirectionalLight(0xffe8d0, 2.4);
      key.position.set(1.2, 2.6, 2.0);
      scene.add(key);
      const rim = new DirectionalLight(0x7fb0ff, 1.6);
      rim.position.set(-2, 2, -2);
      scene.add(rim);
      const floor = new Mesh(new CircleGeometry(6, 64), new MeshStandardMaterial({ color: 0x0c0d11, roughness: 0.6, metalness: 0.2 }));
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const camera = new PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 60);
      const span = Math.max(1, frames.length) * 0.75;
      const target = cam === 'head' ? new Vector3(0, 1.55, 0) : new Vector3(0, 1.2, 0);
      const dist = cam === 'wide' ? span * 2.6 + 1.5 : cam === 'head' ? 1.0 : span * 1.7 + 1.2;
      camera.position.set(0, target.y + 0.12, dist);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.copy(target);
      controls.update();
      window.__camera = camera;
      window.__controls = controls;

      await framesReady();
      const look = q.get('paint') === '1' ? demoLook() : { paint: [] };
      const _d = new Vector3();
      const _e = new Vector3();
      frames.forEach((frame, i) => {
        const rig = buildBoxer(0, tone === 'onyx' ? 'onyx' : 'blank');
        const g = new Group();
        for (const piece of rig.all) {
          piece.visible = true;
          g.add(piece);
        }
        solveTorso(rig, new Vector3(0, 1.5, 0), new Quaternion(), 0, 0, _d, _e);
        rig.gloves[0].position.set(-0.24, 1.1, -0.26);
        rig.gloves[1].position.set(0.24, 1.1, -0.26);
        g.position.x = (i - (frames.length - 1) / 2) * 0.75;
        g.rotation.y = Math.PI + yaw; // the rig faces −z; turn it to face the camera
        const ids = frame === 'standard' ? gear : [...gear, frame];
        for (const piece of rig.all) applyGear(piece, ids, tone);
        for (const piece of rig.all) applyLook(piece, look);
        scene.add(g);
      });
      document.getElementById('hud').textContent = `FORGE · ${frames.join(' · ').toUpperCase()}${gear.length ? ' · ' + gear.join(', ') : ''}`;

      renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
      });
      addEventListener('resize', () => {
        renderer.setSize(innerWidth, innerHeight);
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
      });
    </script>
  </body>
</html>
