<!doctype html>
<!-- DEV-ONLY harness: renders avatar skins / platform pads for screenshots.
     Not part of the game; never ship or link this page. -->
<html>
  <body style="margin:0; background:#181a20">
    <script type="module">
      import {
        Color,
        DirectionalLight,
        Group,
        HemisphereLight,
        PerspectiveCamera,
        PMREMGenerator,
        Scene,
        WebGLRenderer,
      } from 'three';
      import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
      import { buildBoxer } from '/src/avatar/boxer.ts';
      import { applyAvatarSkin, applyPlatformSkin, avatarSkin, platformSkin } from '/src/avatar/skins.ts';
      import { makePlatform } from '/src/arena/arena.ts';
      import { decksSettled } from '/src/arena/decks.ts';
      import { applyGear } from '/src/avatar/gear.ts';

      const params = new URLSearchParams(location.search);
      const skinIds = (params.get('skins') ?? '').split(',').filter(Boolean);
      const padIds = (params.get('pads') ?? '').split(',').filter(Boolean);
      const yaw = Number(params.get('yaw') ?? 0); // extra rig yaw, radians
      // ?gear=crest,pauldrons,knuckles — worn by every rig shown (avatar/gear.ts).
      const gear = (params.get('gear') ?? '').split(',').filter(Boolean);

      const scene = new Scene();
      scene.background = new Color(0x181a20);
      const renderer = new WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(1);
      document.body.appendChild(renderer.domElement);
      scene.environment = new PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
      scene.add(new HemisphereLight(0xbfd4ff, 0x2a241c, 1.1));
      const key = new DirectionalLight(0xfff1dd, 2.0);
      key.position.set(2, 3, -2.5);
      scene.add(key);
      const fill = new DirectionalLight(0x9ab8ff, 0.7);
      fill.position.set(-2.5, 1.5, -1);
      scene.add(fill);

      const camera = new PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 30);

      const spacing = 1.15;
      let i = 0;
      for (const id of skinIds) {
        const g = new Group();
        g.position.x = (i - (skinIds.length - 1) / 2) * spacing;
        g.rotation.y = yaw;
        const rig = buildBoxer(0, id);
        rig.head.position.set(0, 1.52, 0);
        // ONE body, planted at the hips (its rings are hip-local).
        rig.body.position.set(0, 0.88, 0);
        g.add(rig.head, rig.torso);
        rig.gloves[0].position.set(-0.32, 1.0, -0.14);
        rig.gloves[1].position.set(0.32, 1.0, -0.14);
        g.add(rig.gloves[0], rig.gloves[1]);
        for (const part of rig.all) applyAvatarSkin(part, avatarSkin(id));
        for (const part of rig.all) applyGear(part, gear, id === 'onyx' ? 'onyx' : 'white');
        scene.add(g);
        i++;
      }
      if (skinIds.length) {
        // Front is -z: camera out on -z looking back.
        camera.position.set(0, 1.35, -2.6 - (skinIds.length - 1) * 0.5);
        camera.lookAt(0, 1.2, 0);
        // ?zoom=3 — close on the shoulders and head (gear fit).
        const zoom = Number(params.get('zoom') ?? 1);
        if (zoom > 1) {
          camera.position.set(0, 1.4 + 0.25 / zoom, -2.6 / zoom - (skinIds.length - 1) * 0.5);
          camera.lookAt(0, 1.3, 0);
        }
      }

      let j = 0;
      const padSpacing = 2.1;
      for (const id of padIds) {
        const pad = makePlatform(0xff7a18);
        pad.position.set((j - (padIds.length - 1) / 2) * padSpacing, 0.55, 0);
        applyPlatformSkin(pad, platformSkin(id));
        scene.add(pad);
        j++;
      }
      if (padIds.length && !skinIds.length) {
        if (params.get('view') === 'stand') {
          // ?view=stand — the fighter's own eye: standing on the pad (top
          // face at y 0.55 here), looking down toward the foe.
          camera.position.set(0, 0.55 + 1.6, 0.35);
          camera.lookAt(0, 0.55, -0.55);
        } else {
          // High three-quarter view so the deck (and its decal) is visible.
          camera.position.set(0.4, 2.6, -2.4);
          camera.lookAt(0, 0.5, 0);
        }
      }

      // Decks refine to full size a slice at a time; shoot the finished ones.
      await decksSettled();
      renderer.render(scene, camera);
      // Let textures/env settle, render once more, then flag ready.
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          renderer.render(scene, camera);
          document.title = 'preview-ready';
        });
      });
    </script>
  </body>
</html>
