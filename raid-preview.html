<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>raid set preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #040309; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- Dev-only look-dev harness for the RAVE RAID set: the void (SetEnvironment), the light rig
         (DiscoRig) and the ring of decks + stage, animated on a fake 128 BPM clock.
         ?seats=8&x=0&y=1.65&z=0&yaw=0&pitch=0.05&act=1&energy=0.8&track=combat&set=void&board=1
         &beat=28 starts the clock there (28 = a phrase's gather, 32 = its hit); &look=tent pins the
         light show's look (sweep · mirror · wave · chase · tent · ceiling).
         window.__raid.step(n) advances n frames and renders (for hidden panes). -->
    <script type="module">
      import { Color, FogExp2, NoToneMapping, PerspectiveCamera, Scene, WebGLRenderer } from 'three';
      import { SetEnvironment } from '/src/rave/arena/environment.ts';
      import { SpectrumSet } from '/src/rave/arena/spectrum/set.ts';
      import { paletteFor } from '/src/rave/arena/spectrum/palettes.ts';
      import { DiscoRig } from '/src/rave/arena/disco.ts';
      import { forceLook } from '/src/rave/arena/lightshow.ts';
      import { driveRim } from '/src/rave/arena/stage.ts';
      import { buildArena } from '/src/rave/arena/arena.ts';
      import { VOID_BG } from '/src/rave/arena/voidkit.ts';
      import { BOARD_Y, HoloBoard } from '/src/rave/ui/board.ts';

      const params = new URLSearchParams(location.search);
      const num = (k, d) => Number(params.get(k) ?? d);
      const renderer = new WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = NoToneMapping;
      document.body.appendChild(renderer.domElement);
      const scene = new Scene();
      scene.background = new Color(VOID_BG);
      scene.fog = new FogExp2(VOID_BG, 0.022);
      const seats = num('seats', 8);
      const a = buildArena(scene, seats, 0, (s) => `RAVER-${100 + s}`);
      const rig = new DiscoRig();
      scene.add(rig.root);
      rig.root.position.copy(a.stage.position);
      // ?set=void shows the old void; ?track=<id> dresses SPECTRUM in that record's sleeve.
      const env = params.get('set') === 'void' ? new SetEnvironment(scene, renderer) : new SpectrumSet(scene);
      if (params.get('track') && env.setPalette) env.setPalette(paletteFor(params.get('track')), params.get('track').toUpperCase(), true);
      env.root.position.copy(a.stage.position);
      env.root.visible = true;      // DiscoSystem shows it on countdown/raid/podium
      // ?board=1 hangs the holo leaderboard where RankSystem does, with fake rows.
      if (params.get('board')) {
        const board = new HoloBoard();
        board.group.position.set(a.stage.position.x, BOARD_Y + a.stage.position.y, a.stage.position.z);
        board.group.lookAt(num('x', 0), num('y', 1.65), num('z', 0));
        board.redraw(Array.from({ length: seats }, (_, i) => ({
          rank: i + 1, name: i === 0 ? 'YOU' : `BOT${String(i).padStart(2, '0')}`, score: 9000 - i * 850,
          combo: 8 - i, alive: i < seats - 1, isMe: i === 0, colorCss: `hsl(${(i * 47) % 360}, 100%, 62%)`,
        })));
        scene.add(board.group);
      }
      rig.root.visible = true;
      const camera = new PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.05, 400);
      camera.position.set(num('x', 0), num('y', 1.65), num('z', 0));
      camera.rotation.order = 'YXZ';
      camera.rotation.y = num('yaw', 0);
      camera.rotation.x = num('pitch', 0.05);
      const act = num('act', 1);
      const energy = num('energy', 0.8);
      if (params.get('look')) forceLook(params.get('look'));
      let t = num('beat', 0) / (128 / 60);
      const frame = (dt) => {
        t += dt;
        const beat = t * (128 / 60);
        env.update(dt, beat, act, energy);
        if (env.palette) rig.setPalette(env.palette.lasers);
        rig.update(dt, beat, act, energy, env.cue ? { cue: env.cue, focus: env.focus, bass: env.bass } : {});
        if (env.cue) {
          // The DJ's rim, as DiscoSystem drives it.
          const c = env.cue;
          const k = c.open * (1 - c.gather);
          const L = env.palette.lasers;
          driveRim(a.stageRimMat, {
            base: new Color(0x20bfd5), a: new Color(L[0]), b: new Color(L[1 % L.length]), lamps: rig.lamps,
            gain: energy, beat, hit: c.hit, gather: c.gather, swing: c.swing, head: c.head,
            dir: Math.floor(c.beat / 8) % 2 === 0 ? 1 : -1,
            wave: c.look === 'wave' ? k : 0, chase: c.look === 'chase' ? k : 0,
            mirror: c.look === 'mirror' ? k : 0, sweep: c.look === 'sweep' ? k : 0,
          });
        }
        renderer.render(scene, camera);
      };
      renderer.setAnimationLoop(() => frame(1 / 60));
      window.__raid = { renderer, scene, camera, env, rig, arena: a, step: (n = 1) => { for (let i = 0; i < n; i++) frame(1 / 60); } };
    </script>
  </body>
</html>
