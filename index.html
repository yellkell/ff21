<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fire Fight 2</title>
    <link rel="icon" type="image/png" href="/firefightfavicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#07061a" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #07061a;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #scene-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background:
          radial-gradient(circle at 72% 28%, rgba(255, 61, 166, 0.18), transparent 34rem),
          linear-gradient(135deg, #05060d 0%, #0b0716 52%, #120617 100%);
      }
      /* 1. The publisher card, as the headset opens (experience/BootIntro.ts):
         black, "yellkell.com PRESENTS" fades in and out, then the landing. */
      #presents {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #000;
        cursor: pointer;
        /* two animations, not one: the fade is opacity alone, so it runs off
           the main thread and still happens while the world is being built
           (visibility can't, and in the same keyframes the black card sat
           there, text gone, until the build let go) */
        animation:
          presents-out 0.45s ease 3s forwards,
          presents-gone 0s linear 3.45s forwards;
      }
      #presents .pub,
      #presents .sub {
        opacity: 0;
        animation: presents-card 3s linear forwards;
      }
      #presents .pub {
        font: 500 clamp(44px, 9vw, 104px) / 1 system-ui, -apple-system, sans-serif;
        color: #fff;
        text-shadow: 0 0 30px rgba(255, 255, 255, 0.45);
      }
      #presents .sub {
        font: 400 clamp(13px, 2.2vw, 26px) / 1 system-ui, -apple-system, sans-serif;
        letter-spacing: 0.9em;
        text-indent: 0.9em;
        color: #9aa0a8;
      }
      @keyframes presents-card {
        0% { opacity: 0; }
        17% { opacity: 1; }
        83% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes presents-out {
        to { opacity: 0; }
      }
      @keyframes presents-gone {
        to { visibility: hidden; }
      }
      /* A tap on the card goes straight to the landing. */
      body.skip-intro #presents,
      body.app-entered #presents {
        display: none;
      }
      /* 2. The landing is the NEON DISTRICT at night: the sign hung in a
         wet magenta/cyan haze over a receding grid, rain streaking past,
         CRT scanlines over everything — the 2D face of the holo menus. */
      :root {
        --cyan: #3ff2ff;
        --cyan-rgb: 63, 242, 255;
        --hot: #ff3da6;
        --hot-rgb: 255, 61, 166;
      }
      .landing {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(28px, 6vh, 56px);
        padding: clamp(16px, 5vw, 48px);
        box-sizing: border-box;
        overflow: hidden;
        background:
          radial-gradient(ellipse 70% 45% at 50% 38%, rgba(var(--hot-rgb), 0.16), transparent 70%),
          radial-gradient(ellipse 60% 40% at 30% 70%, rgba(var(--cyan-rgb), 0.08), transparent 70%),
          linear-gradient(180deg, #07061a 0%, #0b0716 55%, #120617 100%);
        transition:
          opacity 220ms ease,
          visibility 220ms ease;
      }
      /* The street: a perspective grid sliding toward you under the sign. */
      .landing__grid {
        position: absolute;
        left: -50%;
        right: -50%;
        bottom: -10%;
        height: 55%;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(var(--hot-rgb), 0.38) 1px, transparent 1px),
          linear-gradient(90deg, rgba(var(--cyan-rgb), 0.3) 1px, transparent 1px);
        background-size: 64px 64px;
        transform: perspective(380px) rotateX(64deg);
        transform-origin: 50% 0;
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 45%);
        mask-image: linear-gradient(180deg, transparent 0%, #000 45%);
        animation: grid-run 1.6s linear infinite;
      }
      @keyframes grid-run {
        to { background-position: 0 64px, 0 0; }
      }
      /* Rain: two sheets of thin streaks at different speeds. */
      .landing__rain,
      .landing__rain::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: repeating-linear-gradient(
          100deg,
          transparent 0 22px,
          rgba(170, 220, 255, 0.07) 22px 23px,
          transparent 23px 61px
        );
        background-size: 100% 240px;
        animation: rain-fall 0.55s linear infinite;
      }
      .landing__rain::after {
        content: '';
        background-size: 100% 180px;
        opacity: 0.7;
        animation-duration: 0.8s;
        transform: translateX(31px);
      }
      @keyframes rain-fall {
        to { background-position: -40px 240px; }
      }
      /* CRT: scanlines + a vignette, over everything but never in the way. */
      .landing__crt {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        background:
          repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px),
          radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.65) 100%);
      }
      /* Corner HUD readouts. */
      .landing__hud {
        position: absolute;
        z-index: 2;
        font: 600 11px/1.6 ui-monospace, Consolas, monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(var(--cyan-rgb), 0.55);
        pointer-events: none;
      }
      .landing__hud--tl {
        top: clamp(14px, 3vh, 26px);
        left: clamp(16px, 3vw, 32px);
      }
      .landing__hud--tr {
        top: clamp(14px, 3vh, 26px);
        right: clamp(16px, 3vw, 32px);
        text-align: right;
        color: rgba(var(--hot-rgb), 0.6);
      }
      .landing__hud b {
        color: var(--cyan);
        font-weight: 700;
      }
      .landing__hud .blink {
        animation: blink 1.1s steps(1) infinite;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
      /* A vertical katakana/kanji blade sign down the right edge. */
      .landing__kanji {
        position: absolute;
        z-index: 1;
        right: clamp(14px, 3vw, 34px);
        top: 50%;
        margin-top: -2.5em;
        writing-mode: vertical-rl;
        font: 900 clamp(22px, 3.4vw, 40px)/1 "Yu Gothic", "Hiragino Sans", "Noto Sans JP", sans-serif;
        letter-spacing: 0.25em;
        color: rgba(var(--hot-rgb), 0.85);
        text-shadow: 0 0 8px rgba(var(--hot-rgb), 0.9), 0 0 26px rgba(var(--hot-rgb), 0.5);
        pointer-events: none;
        animation: tube-buzz 7s infinite;
      }
      @keyframes tube-buzz {
        0%, 61%, 63%, 65%, 100% { opacity: 1; }
        62%, 64% { opacity: 0.35; }
      }
      /* The landing's contents rise in as the publisher card lets go (on the
         contents, not the landing: its own opacity is the app-entered fade). */
      .landing__stage {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(20px, 4vh, 44px);
        width: 100%;
      }
      .landing__stage,
      .discord-corner,
      .landing__hud {
        opacity: 0;
        animation: splash-in 0.9s ease 3.1s forwards;
      }
      body.skip-intro .landing__stage,
      body.skip-intro .discord-corner,
      body.skip-intro .landing__hud {
        animation-delay: 0s;
      }
      /* Powers on like a tube: up, a stutter, then lit. */
      @keyframes splash-in {
        0% { opacity: 0; transform: scale(1.03); }
        55% { opacity: 0.7; }
        62% { opacity: 0.12; }
        70% { opacity: 0.9; transform: none; }
        100% { opacity: 1; transform: none; }
      }
      .landing__logo-wrap {
        position: relative;
        display: grid;
        place-items: center;
      }
      .landing__logo {
        position: relative;
        z-index: 1;
        width: min(86vw, 720px);
        height: auto;
        animation: tube-buzz 9s 2s infinite;
      }
      /* The live glitch: two copies of the sign, clipped to thin bands, kicked
         sideways in magenta/cyan for a few frames every few seconds. */
      .landing__logo.landing__logo--ghost {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        opacity: 0;
      }
      .landing__logo--ghost.a {
        filter: drop-shadow(-4px 0 0 rgba(var(--hot-rgb), 0.9));
        animation: glitch-a 5.3s steps(1) infinite;
      }
      .landing__logo--ghost.b {
        filter: drop-shadow(4px 0 0 rgba(var(--cyan-rgb), 0.9));
        animation: glitch-b 5.3s steps(1) infinite;
      }
      @keyframes glitch-a {
        0%, 88%, 94%, 100% { opacity: 0; transform: none; clip-path: inset(0 0 100% 0); }
        89% { opacity: 1; transform: translateX(-14px); clip-path: inset(31% 0 61% 0); }
        91% { opacity: 1; transform: translateX(10px); clip-path: inset(55% 0 38% 0); }
        93% { opacity: 1; transform: translateX(-6px); clip-path: inset(12% 0 82% 0); }
      }
      @keyframes glitch-b {
        0%, 89%, 94%, 100% { opacity: 0; transform: none; clip-path: inset(0 0 100% 0); }
        90% { opacity: 1; transform: translateX(12px); clip-path: inset(44% 0 47% 0); }
        92% { opacity: 1; transform: translateX(-9px); clip-path: inset(66% 0 26% 0); }
      }
      /* The haze behind the sign: magenta wash under a cyan core, breathing. */
      .landing__glow {
        position: absolute;
        width: 120%;
        aspect-ratio: 3 / 2;
        border-radius: 50%;
        pointer-events: none;
        background:
          radial-gradient(circle, rgba(var(--cyan-rgb), 0.18) 0%, rgba(var(--cyan-rgb), 0.06) 30%, transparent 55%),
          radial-gradient(circle, rgba(var(--hot-rgb), 0.3) 0%, rgba(var(--hot-rgb), 0.1) 45%, transparent 70%);
        filter: blur(6px);
        animation: landing-breathe 3.2s ease-in-out infinite;
      }
      @keyframes landing-breathe {
        0%,
        100% {
          opacity: 0.6;
          transform: scale(0.95);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }
      /* The loader: a terminal status line and a data bar over the button. */
      .landing__dock {
        width: min(100%, 320px);
        display: flex;
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }
      #status {
        font: 600 12px/1.4 ui-monospace, Consolas, monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(var(--cyan-rgb), 0.75);
      }
      #status::before {
        content: '> ';
        color: var(--hot);
      }
      #bar {
        position: relative;
        height: 4px;
        background: rgba(var(--cyan-rgb), 0.1);
        box-shadow: inset 0 0 0 1px rgba(var(--cyan-rgb), 0.25);
        overflow: hidden;
        margin: 10px 0 20px;
        clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
      }
      /* The bar moves from the first frame: until the game's code is in and
         can report real progress (main.ts takes it from there), it creeps
         along on its own, off the main thread. */
      #bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--hot), #b56cff 50%, var(--cyan));
        box-shadow: 0 0 10px rgba(var(--cyan-rgb), 0.7);
        transform: scaleX(0);
        transform-origin: left;
        animation: bar-creep 14s cubic-bezier(0.1, 0.6, 0.3, 1) forwards;
      }
      @keyframes bar-creep {
        to { transform: scaleX(0.3); }
      }
      /* The button is a holo panel in the menus' own glass: translucent cyan
         with a lit rim, chamfered corners and magenta corner brackets. */
      .enter-vr-wrap {
        position: relative;
        filter: drop-shadow(0 0 14px rgba(var(--cyan-rgb), 0.45));
      }
      .enter-vr-wrap::before,
      .enter-vr-wrap::after {
        content: '';
        position: absolute;
        z-index: 1;
        width: 16px;
        height: 16px;
        pointer-events: none;
      }
      .enter-vr-wrap::before {
        top: -6px;
        right: -6px;
        border-top: 2px solid var(--hot);
        border-right: 2px solid var(--hot);
      }
      .enter-vr-wrap::after {
        bottom: -6px;
        left: -6px;
        border-bottom: 2px solid var(--hot);
        border-left: 2px solid var(--hot);
      }
      .enter-vr {
        position: relative;
        width: 100%;
        min-height: 70px;
        border: 0;
        box-sizing: border-box;
        padding: 0 34px;
        color: #eaffff;
        background-color: rgba(6, 10, 22, 0.6);
        background-image:
          linear-gradient(180deg, rgba(var(--cyan-rgb), 0.24) 0%, rgba(var(--cyan-rgb), 0.08) 55%, rgba(var(--cyan-rgb), 0.16) 100%),
          repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 3px);
        clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
        box-shadow:
          inset 0 0 0 1.5px rgba(var(--cyan-rgb), 0.9),
          inset 0 0 24px rgba(var(--cyan-rgb), 0.25);
        cursor: pointer;
        font: 700 1.12rem/1 Bahnschrift, "DIN Alternate", "Arial Narrow", system-ui, sans-serif;
        letter-spacing: 0.34em;
        text-indent: 0.34em; /* recentre — tracking pads the right edge only */
        text-transform: uppercase;
        text-shadow:
          0 0 10px rgba(var(--cyan-rgb), 0.95),
          0 0 22px rgba(var(--cyan-rgb), 0.5);
        animation: enter-vr-breathe 2.6s ease-in-out infinite;
        transition:
          color 160ms ease,
          background-color 160ms ease,
          transform 160ms ease;
      }
      @keyframes enter-vr-breathe {
        0%,
        100% { background-color: rgba(6, 10, 22, 0.6); }
        50% { background-color: rgba(18, 60, 84, 0.6); }
      }
      .enter-vr:hover,
      .enter-vr:focus-visible {
        color: #fff;
        background-color: rgba(26, 92, 120, 0.7);
        transform: translateY(-1px);
        animation: none;
      }
      .enter-vr:focus-visible {
        outline: 2px solid var(--hot);
        outline-offset: 4px;
      }
      .enter-vr:disabled {
        cursor: wait;
        opacity: 0.55;
        transform: none;
        animation: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .landing__glow,
        .landing__grid,
        .landing__rain,
        .landing__rain::after,
        .landing__logo,
        .landing__kanji,
        .landing__hud .blink,
        .enter-vr {
          animation: none;
        }
        .landing__logo.landing__logo--ghost {
          display: none;
        }
      }
      /* Bottom-left community corner: a quiet label and the Discord mark. */
      .discord-corner {
        position: absolute;
        z-index: 2;
        left: clamp(16px, 3vw, 32px);
        bottom: clamp(16px, 3vh, 28px);
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
      }
      .discord-corner span {
        color: rgba(var(--cyan-rgb), 0.7);
        font: 600 0.8rem/1 ui-monospace, Consolas, monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .discord-corner svg {
        width: 32px;
        height: 32px;
        fill: #7983f5;
        filter: drop-shadow(0 0 6px rgba(121, 131, 245, 0.8));
        transition: fill 150ms ease, transform 150ms ease;
      }
      .discord-corner:hover svg,
      .discord-corner:focus-visible svg {
        fill: #a3abff;
        transform: translateY(-1px);
      }
      .discord-corner:hover span,
      .discord-corner:focus-visible span {
        color: var(--cyan);
      }
      .landing__join {
        margin: 14px auto 0;
        max-width: 420px;
        text-align: center;
        color: var(--hot);
        font: 600 12px/1.6 ui-monospace, Consolas, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-shadow: 0 0 8px rgba(var(--hot-rgb), 0.6);
      }
      body.app-entered .landing {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @media (max-width: 700px) {
        .landing__logo {
          width: min(96vw, 720px);
        }
        .landing__kanji,
        .landing__hud--tr {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="presents" aria-hidden="true">
      <div class="pub">yellkell.com</div>
      <div class="sub">PRESENTS</div>
    </div>
    <section class="landing" id="landing" aria-label="Fire Fight">
      <div class="landing__rain" aria-hidden="true"></div>
      <div class="landing__grid" aria-hidden="true"></div>
      <div class="landing__hud landing__hud--tl" aria-hidden="true">NEON DISTRICT ARENA II<br />SECTOR 07 // <b>ARENA LINK</b> <span class="blink">&#9608;</span></div>
      <div class="landing__hud landing__hud--tr" aria-hidden="true">&#38632; &middot; 23:47<br />HEADSET REQUIRED</div>
      <div class="landing__kanji" aria-hidden="true">&#28814;&#12398;&#21927;&#22041;</div>
      <div class="landing__stage">
        <div class="landing__logo-wrap">
          <div class="landing__glow" aria-hidden="true"></div>
          <img class="landing__logo" src="/signs/fire-fight.png" alt="FIRE FIGHT 2" />
          <img class="landing__logo landing__logo--ghost a" src="/signs/fire-fight.png" alt="" aria-hidden="true" />
          <img class="landing__logo landing__logo--ghost b" src="/signs/fire-fight.png" alt="" aria-hidden="true" />
        </div>
        <div class="landing__dock">
          <div id="status" role="status">Loading…</div>
          <div id="bar" aria-hidden="true"><div id="bar-fill"></div></div>
          <div class="enter-vr-wrap"><button class="enter-vr" id="enter-vr" type="button" disabled>Enter VR</button></div>
        </div>
        <p class="landing__join" id="join-hint" hidden></p>
      </div>
      <script>
        // A join link (?join=CODE): say so under the button, so a phone that
        // opened it knows to hand over to the headset (DESIGN §8.2).
        (function () {
          var code = new URLSearchParams(location.search).get('join') || '';
          var hint = document.getElementById('join-hint');
          if (!hint || !/^\d{4,5}$/.test(code)) return;
          hint.hidden = false;
          hint.textContent = (code.length === 4 ? 'CLUB ROOM ' : 'ROOM ') + code + ' — open this link in your headset and press ENTER VR to walk straight in.';
        })();
      </script>
      <a class="discord-corner" href="https://discord.gg/gJY3XhejZf" target="_blank" rel="noopener" aria-label="Join the Discord">
        <span>Join the Discord</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z" /></svg>
      </a>
      <div class="landing__crt" aria-hidden="true"></div>
    </section>
    <script>
      // A tap on the publisher card goes straight to the landing.
      document.getElementById('presents').addEventListener('click', function () {
        document.body.classList.add('skip-intro');
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
